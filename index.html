<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Zauberschule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: candlelit, quiet, a little enchanted; the rooms do the talking
   IDEA: a magic school you walk through; each object holds one part of your German
   PICTURE: the room pictures fill the screen, brought to life with light, dust and candles
   COLOUR and TYPE: near-black ink, parchment cards, old gold; Cormorant Garamond titles, Nunito text
   LAYOUT: full-screen room, a slim top bar with rooms, station chips along the bottom, panels slide over */
:root{color-scheme:dark;--ink:#f3e6cc;--soft:#c2b293;--gold:#d9b46a;--sheet:#1a1a1a;--line:#3b342a;--paper:#eadbb9;--pink:#2b1d12;--psoft:#6b5236;--pline:#cdb88c;--acc:#b5552f;--y:#e9c46a;--r:#d96c5f;--b:#6fa8dc;--g:#69b47a;--o:#e8954a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0d0b09;color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px max(2vw,12px) 26px;background:linear-gradient(#0d0b09e6,#0d0b0900);pointer-events:none}
.top>*{pointer-events:auto}
.top h1{font-size:clamp(24px,3vw,34px);color:var(--ink);text-shadow:0 2px 8px #000}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar button,#rooms button{min-height:38px;border:1px solid #d9b46a66;background:#1a1611cc;border-radius:999px;padding:4px 14px;font-weight:700;font-size:14px;color:var(--ink);backdrop-filter:blur(4px)}
#rooms{display:flex;gap:6px;flex-wrap:wrap}#rooms button.on{background:var(--gold);color:#1a1209;border-color:var(--gold)}
#status{font-size:12px;color:var(--soft);text-shadow:0 1px 3px #000}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transition:transform .25s ease-out;will-change:transform}
#world.zooming .tag{opacity:0}#world#world.zooming{transition:transform .5s cubic-bezier(.45,0,.25,1)}
#world.unzooming{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){#world,#world.zooming,#world.unzooming{transition:none!important}}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
#tint{position:absolute;inset:0;background:#0b1640;mix-blend-mode:multiply;opacity:0;transition:opacity .8s;pointer-events:none}
body.night #tint{background:linear-gradient(#4b5aa0,#5d6aa8)}
#bg{transition:filter .8s ease}
body.mood-herbst #tint{background:#f2b26e}
body.mood-regen #tint{background:#b9c6da}
body.mood-herbst #bg{filter:saturate(1.12) brightness(.92)}
body.mood-herbst[data-room="see"] #bg{filter:brightness(.76) saturate(1.05)}
body.mood-regen #bg{filter:saturate(.6) brightness(.84) contrast(1.04)}
#glows{position:absolute;inset:0;pointer-events:none;transition:opacity .8s}
#glows i{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#ffd27acc,#ffb04a44 40%,#ffb04a00 70%);mix-blend-mode:screen;animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{0%{opacity:.75;transform:translate(-50%,-50%) scale(1)}35%{opacity:1}60%{opacity:.82;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:.95}}
#spots{position:absolute;inset:0}
.spot{position:absolute;border:0;background:transparent;border-radius:14px;transition:box-shadow .25s,background .25s}
.spot:hover,.spot:focus-visible{background:radial-gradient(#ffe2a033,#ffe2a000 70%);box-shadow:0 0 0 2px #ffe2a088,0 0 26px #ffd27a66;outline:none}
.tag{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;border:0;background:#1a1611d9;color:var(--ink);border-radius:999px;padding:4px 11px 4px 7px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 10px #0008;border:1px solid #d9b46a55}
.tag:hover{background:#2a2117f0}
.spark{width:9px;height:9px;border-radius:50%;background:#ffe2a0;box-shadow:0 0 8px #ffd27a,0 0 16px #ffd27a;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
body.nolabels .tl{display:none}body.nolabels .tag{padding:4px;background:transparent;border-color:transparent;box-shadow:none}
.chips{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;gap:8px;overflow-x:auto;padding:24px max(2vw,12px) 12px;background:linear-gradient(#0d0b0900,#0d0b09e6);scrollbar-width:none}
.chips button{flex:none;min-height:42px;border:1px solid #d9b46a55;background:#1a1611d9;border-radius:999px;padding:6px 15px;font-weight:700;color:var(--ink);backdrop-filter:blur(4px)}
.chips button small{color:var(--soft);font-weight:600;margin-left:6px}
.chips button:hover{border-color:var(--gold)}
#closeup{position:fixed;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity .3s ease-out;background:#0d0b09}#closeup img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}#closeup.on{opacity:1;transition:opacity .5s ease-out}#closeup.on img{transform:scale(1)}body.night #closeup img{filter:brightness(.55) saturate(.8) sepia(.25)}
#door{position:fixed;inset:0;z-index:8;background:#0d0b09 url(img/door.jpg) center/auto 80% no-repeat;opacity:0;pointer-events:none;transition:opacity .4s}
#door.on{opacity:1}
@media (prefers-reduced-motion:reduce){#glows i,.spark{animation:none}#world{transition:none}}
/* panel */
.ov{position:fixed;inset:0;background:rgba(5,4,3,.55);display:flex;align-items:center;justify-content:center;z-index:5;padding:12px}
.ov[hidden]{display:none}
.sheet{background:var(--sheet);color:var(--ink);width:min(880px,100%);max-height:92vh;overflow:auto;border-radius:20px;border:1px solid #d9b46a44;box-shadow:0 20px 60px #000c}
.sh{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:18px 22px 12px;position:sticky;top:0;background:var(--sheet);z-index:1;border-bottom:1px solid var(--line)}
.sh h2{font-size:clamp(30px,4.4vw,42px);color:var(--ink)}
.obj{margin:0;font-size:14px;color:var(--gold);font-weight:700}
.en{margin:2px 0 0;color:var(--soft);font-size:15px}
#part{flex:none;display:flex;align-items:center}#part img{display:block;height:96px;width:auto;border-radius:10px}
.potion{width:96px;height:96px;border-radius:50%;background:conic-gradient(from 0deg,#3fbf8f,#2c7fbf,#7a4fc0,#3fbf8f);filter:blur(1px);box-shadow:0 0 30px #3fbf8f88,inset 0 0 22px #0008;animation:swirl 6s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#2a241c;color:var(--ink);font-size:24px;line-height:1;flex:none}
.tabs{display:flex;gap:6px;padding:12px 22px 0}.tabs:empty{display:none}
.tabs button,.seg button{min-height:40px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 16px;font-weight:700;color:var(--ink)}
.tabs button.on,.seg button.on{background:var(--gold);color:#1a1209;border-color:var(--gold)}
.pb{padding:16px 22px 26px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.note,.grp,.entry,.game,.pinc,.ytbox,.prompt{background:var(--paper);color:var(--pink);border:1px solid var(--pline);border-radius:14px}
.note{padding:14px 16px;margin-bottom:12px}.note h3{font-size:23px;margin-bottom:6px}
.note p{margin:4px 0}.note ul{margin:6px 0;padding-left:20px}
.note table,.menu{border-collapse:collapse;margin:8px 0;font-size:15px}
.note th,.note td,.menu th,.menu td{border:1px solid var(--pline);padding:6px 10px;text-align:left;vertical-align:top}
.note tr:first-child th,.menu tr:first-child th{background:#dcc597}
.note .hint,.grp p,.entry .pr,.game .hint,.ytbox .hint,.prompt .hint,.pinc small{color:var(--psoft)}
mark{background:#f4d58a;color:#2b1d12;border-radius:4px;padding:0 3px}
.na{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.btn{min-height:44px;border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 14px;font-weight:700;color:var(--ink)}
.note .btn,.grp .btn,.entry .btn,.game .btn,.ytbox .btn{color:var(--pink);border-color:var(--pline)}
.btn.main,.note .btn.main,.game .btn.main,.ytbox .btn.main,.grp .btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:2px 10px;font-size:14px}
.btn.danger{color:#ff9a8a}.note .btn.danger,.entry .btn.danger,.ytbox .btn.danger{color:#a8321f}
input[type=text],input[type=date],textarea,select,input.cell{border:1px solid var(--pline);border-radius:12px;padding:10px 12px;background:#fbf4e4;color:var(--pink);font-size:16px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.6}
.hint{font-size:14px;color:var(--soft);margin:4px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>input{flex:1 1 180px;width:auto}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px;margin-bottom:16px}
.grp{padding:12px 14px}.grp h3{font-size:21px}.grp p{margin:2px 0 8px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:2px;background:#fbf4e4;color:var(--pink);border:1px solid var(--pline);border-radius:999px;padding:2px 4px 2px 10px;margin:0 4px 6px 0;font-size:15px}
.chip button{border:0;background:none;width:26px;height:26px;border-radius:50%;color:var(--psoft)}
.c-koord{border-left:8px solid var(--y)}.c-sub,.c-dat{border-left:8px solid var(--r)}.c-adv{border-left:8px solid var(--b)}.c-wech{border-left:8px solid var(--o)}.c-akk{border-left:8px solid var(--g)}
.game{padding:18px;margin-bottom:16px;text-align:center}
.game .seg button{border-color:var(--pline);color:var(--pink)}.game .seg button.on{background:var(--pink);color:var(--paper);border-color:var(--pink)}
.big{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1.1;margin:8px 0 14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px;padding:8px;border-radius:14px}
.tiles.ans{background:#f5ead1;border:2px dashed var(--pline);margin-bottom:10px}
.tile{min-height:44px;border:2px solid #b8955f;background:#fff8e8;color:#2b1d12;border-radius:10px;padding:6px 12px;font-weight:700;font-size:17px}
.fb{min-height:28px;margin:10px 0 0;font-weight:700}.fb.ok{color:#2f7a3e}.fb.bad{color:#a8321f}
.jars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.jars button{min-height:64px;border-radius:16px;border:0;font-weight:700;color:#fff;padding:8px}
.menu{margin:0 auto 12px}.menu input.cell{width:84px;padding:6px 8px;text-align:center}
.cell.ok{border-color:#2f7a3e;background:#e4f4e6}.cell.bad{border-color:#a8321f;background:#fbe4e1}.menu small{display:block;color:#a8321f;font-weight:700}
.card{min-height:190px;border-radius:16px;border:0;width:100%;background:#fbf4e4;color:#2b1d12;padding:20px;box-shadow:0 4px 0 #cdb88c;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.card dl{display:grid;grid-template-columns:auto auto;gap:4px 14px;margin:0;text-align:left;font-size:18px}.card dt{color:#7a6046}.card dd{margin:0;font-weight:700}
.vt td,.vt th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}.vt{border-collapse:collapse;width:100%}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:14px}
.recw{display:flex;flex-direction:column;gap:8px}
.rec{border:0;border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;text-align:left;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;line-height:1.1;box-shadow:0 6px 0 rgba(0,0,0,.3);position:relative;overflow:hidden;text-decoration:none}
.rec small{font-family:Nunito,sans-serif;font-size:14px;opacity:.9}.rec{outline:3px solid transparent;outline-offset:3px;transition:outline-color .2s ease-out,transform .16s ease-out}
.rec:active{transform:scale(.97)}
.rec.on{outline-color:var(--gold)}
.recs:has(.playing) .rec.on:not(.playing){outline-color:transparent}
.rec svg{position:absolute;inset:0;width:100%;height:100%}.rec span{position:relative}
.yt{font-weight:700;color:#f2b98a;text-decoration:none;padding:6px 2px}
.ytbox{padding:12px 16px;margin-top:18px}
.ytbox.ytm{margin:0 0 16px}
.m-room .beam{background:radial-gradient(ellipse 60% 40% at 50% 18%,#fff4c855 0,#0000 70%);mix-blend-mode:screen;animation:glowpulse 7s ease-in-out infinite}
.recs{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.bar button.icon{width:40px;padding:0;display:inline-grid;place-items:center}
.bar button.icon svg{width:20px;height:20px;display:block}
#mute[aria-pressed="true"]{border-color:#d98a6a;color:#f2b98a}
#roomsel{display:none;min-height:38px;border:1px solid #d9b46a66;background:#1a1611cc;border-radius:999px;padding:4px 30px 4px 14px;font-weight:700;font-size:14px;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,#0000 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,#0000 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
@media(max-width:600px){#rooms button{display:none}#roomsel{display:block}}
.xfade{position:absolute;left:0;top:0;pointer-events:none;z-index:2;will-change:opacity}
.xfade .tag,.xfade .spot{pointer-events:none}
.quote{margin:16px auto 0;max-width:560px;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px;line-height:1.35;color:var(--ink)}
.quote span{display:block;font-family:Nunito,sans-serif;font-style:normal;font-size:13px;margin-top:4px;color:var(--soft)}
.quote span::before{content:'— '}
.sh.hero{position:relative;min-height:clamp(170px,30vw,250px);align-items:flex-end;overflow:hidden;isolation:isolate;background:none}
.sh.hero::before{content:'';position:absolute;inset:0;z-index:-2;background:url(img/hero-musik.jpg) center 50%/cover;transform-origin:47% 45%;animation:herodrift 30s ease-in-out infinite alternate}
.sh.hero::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0000 35%,var(--sheet) 98%)}
.sh.hero h2,.sh.hero p{text-shadow:0 2px 10px #000,0 0 2px #000}
@keyframes herodrift{from{transform:scale(1)}to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.sh.hero::before{animation:none}}
.rec.photo{padding:0;aspect-ratio:3/4;background:#1a1611;isolation:isolate}
.rec.photo .ph{position:absolute;inset:0;overflow:hidden;z-index:-2}
.rec.photo .ph img{width:100%;height:100%;object-fit:cover;transform-origin:50% 40%;animation:kb 22s ease-in-out infinite alternate}
.rec.photo .lbl{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(#0000,#000000c4)}
.rec.photo.playing{outline-color:var(--gold)}
.rec .fx{position:absolute;inset:0;pointer-events:none;z-index:-1}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.15) translate(-2.5%,-2%)}}
@keyframes glowpulse{50%{opacity:.6}}
@property --ra{syntax:'<angle>';inherits:false;initial-value:0deg}
.m-morgen .sun{background:radial-gradient(circle at 10% 40%,#ffd27aa6 0,#ffb24d38 16%,#0000 42%);mix-blend-mode:screen;animation:glowpulse 6s ease-in-out infinite}
.m-morgen .rays{background:repeating-conic-gradient(from var(--ra) at 10% 40%,#fff1c22e 0 3deg,#0000 3deg 12deg);mix-blend-mode:screen;-webkit-mask-image:radial-gradient(circle at 10% 40%,#000 0,#0000 70%);mask-image:radial-gradient(circle at 10% 40%,#000 0,#0000 70%);animation:rays 50s linear infinite}
@keyframes rays{to{--ra:360deg}}
.m-herbst .lf{inset:auto;top:-8%;width:10px;height:7px;background:#c8642a;border-radius:0 80% 0 80%;opacity:.92;animation:fall 10s linear infinite}
.m-herbst .l1{left:12%;animation-delay:-1s}.m-herbst .l2{left:35%;animation-delay:-4s;animation-duration:12s;background:#e09a3c}.m-herbst .l3{left:58%;animation-delay:-7s;width:8px;height:6px}.m-herbst .l4{left:76%;animation-delay:-2.5s;animation-duration:13s;background:#a8452a}.m-herbst .l5{left:90%;animation-delay:-9s;background:#e0b04a;width:8px}
@keyframes fall{0%{top:-8%;transform:translateX(0) rotate(0)}30%{transform:translateX(16px) rotate(110deg)}60%{transform:translateX(-8px) rotate(220deg)}100%{top:108%;transform:translateX(12px) rotate(340deg)}}
.m-regen .rain{background:repeating-linear-gradient(100deg,#0000 0 9px,#d6e6ff38 9px 10px,#0000 10px 22px);background-size:60px 60px;animation:rain .6s linear infinite}
.m-regen .r2{background-size:90px 90px;opacity:.55;animation:rain2 .9s linear infinite}
@keyframes rain{to{background-position:-10px 60px}}
@keyframes rain2{to{background-position:-16px 90px}}
.m-regen .flash{background:#e8f0ff;opacity:0;animation:lightning 11s infinite}
@keyframes lightning{0%,92%,100%{opacity:0}93%{opacity:.32}94%{opacity:0}95.5%{opacity:.2}97%{opacity:0}}
.m-nacht .stars{background-image:radial-gradient(1.3px 1.3px at 20% 12%,#fff,#0000),radial-gradient(1px 1px at 42% 6%,#fff,#0000),radial-gradient(1.5px 1.5px at 56% 24%,#fff,#0000),radial-gradient(1px 1px at 88% 8%,#fff,#0000),radial-gradient(1.2px 1.2px at 32% 22%,#fff,#0000),radial-gradient(1px 1px at 8% 26%,#fff,#0000),radial-gradient(1.2px 1.2px at 94% 28%,#fff,#0000);animation:glowpulse 5s ease-in-out infinite}
.m-nacht .moon{background:radial-gradient(circle at 73% 17%,#cfd8ff66 0,#0000 24%);mix-blend-mode:screen;animation:glowpulse 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rec .fx,.rec.photo .ph img{animation:none!important}}
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#0d0b09b3;backdrop-filter:blur(6px)}
#gate[hidden]{display:none}
.gatecard{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);color:var(--pink);border:1px solid var(--pline);border-radius:18px;text-align:center;box-shadow:0 18px 50px #000a}
.gatehero{position:relative;aspect-ratio:2/1;overflow:hidden;background:#1b1014}
.gatehero img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:68% 45%;animation:gatezoom 40s ease-in-out infinite alternate}
.gatehero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0000 55%,var(--paper));pointer-events:none}
@keyframes gatezoom{from{transform:scale(1)}to{transform:scale(1.1)}}
.gatebody{padding:6px 22px 22px}
@media (prefers-reduced-motion:reduce){.gatehero img{animation:none}}
.gatecard h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;margin:0 0 4px}
.gatecard p{margin:6px 0}
.gatecard .btn{width:100%;margin-top:10px;color:var(--pink);border-color:var(--pline)}
.gatecard .btn.main{color:#fff}
.gatecard .hint{color:var(--psoft);font-size:14px}
.gatecard .btn:disabled{opacity:.45;cursor:not-allowed}
.chips{cursor:grab;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.chips.drag{cursor:grabbing;user-select:none}
.chips.drag button{pointer-events:none}
#eyesvg{touch-action:none;cursor:grab}
.eyez{display:flex;gap:6px}
.eyez button{min-width:40px;font-size:20px;line-height:1}
.corr{background:#f6ecd6;border-left:4px solid var(--acc);border-radius:8px;padding:8px 12px;margin:8px 0;white-space:normal}
.corr p{white-space:normal}
.corr .btn{margin:2px 0}
.corrbox{margin-top:10px}
.corrbox textarea{width:100%;min-height:110px;margin-bottom:8px}
#ytp{position:fixed;left:0;bottom:0;width:200px;height:200px;opacity:0;pointer-events:none;z-index:-1;overflow:hidden}.ytbox summary{cursor:pointer;min-height:32px}
.jstats{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px;color:var(--soft);margin:8px 0 12px}

<script>
{
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/==(.+?)==/g,'<mark>$1</mark>');
function md(src){const L=esc(src).split('\n');let h='',i=0;while(i<L.length){const l=L[i];
  if(l.trim().startsWith('|')){const rows=[];while(i<L.length&&L[i].trim().startsWith('|')){rows.push(L[i].trim().replace(/^\||\|$/g,'').split('|'));i++}
    h+='<div class="scroll"><table>'+rows.map((r,j)=>'<tr>'+r.map((c,k)=>(j===0||k===0)?`<th>${inl(c.trim())}</th>`:`<td>${inl(c.trim())}</td>`).join('')+'</tr>').join('')+'</table></div>';continue}
  if(l.startsWith('- ')){const it=[];while(i<L.length&&L[i].startsWith('- ')){it.push(L[i].slice(2));i++}h+='<ul>'+it.map(x=>`<li>${inl(x)}</li>`).join('')+'</ul>';continue}
  if(l.trim())h+=`<p>${inl(l)}</p>`;i++}return h}
const rid=()=>Math.random().toString(36).slice(2,9);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};

/* ---------- default music (YouTube, sound only) ---------- */

const REC_QUOTE={room:['Working hard is important. But there is something that matters even more: believing in yourself.','Harry Potter'],morgen:['It does not do to dwell on dreams and forget to live.','Albus Dumbledore'],herbst:['Being different isn’t a bad thing. It means you’re brave enough to be yourself.','Luna Lovegood'],regen:['We’ve all got both light and dark inside us. What matters is the part we choose to act on. That’s who we really are.','Sirius Black'],nacht:['Happiness can be found, even in the darkest of times, if one only remembers to turn on the light.','Albus Dumbledore']};

/* ---------- starter content (from the mind map) ---------- */
const DEF={mood:'morgen',leaves:3,correct:0,
notes:{
satzbau:[
N('Hauptsatz · main clause','The conjugated verb is always in **position 2**.\n- ==Ich== **trinke** heute einen Kaffee.\n- Heute **trinke** ==ich== einen Kaffee.\nIf something else comes first, the subject moves behind the verb.'),
N('Nebensatz · subordinate clause','Main clause, + connector + subject + … + **verb at the end**.\n- Ich bleibe zu Hause, **weil** ich müde **bin**.\nStarts with weil, dass, wenn, ob … (see the cups: Konnektoren).'),
N('Relativsatz · relative clause','Main clause (with the noun), + relative pronoun + … + **verb at the end**.\nThe pronoun takes **gender + number** from the noun, and its **case** from its job in the relative clause.\n- Das ist der Mann, **der** in Zürich **wohnt**.\n- Das ist der Mann, **den** ich gut **kenne**.\n| |Nom|Akk|Dat|Gen\n|M|der|den|dem|dessen\n|F|die|die|der|deren\n|N|das|das|dem|dessen\n|Pl|die|die|denen|deren'),
N('TeKaMoLo · adverbial word order','Extra info after the verb goes: **Te**mporal (wann?) → **Ka**usal (warum?) → **Mo**dal (wie?) → **Lo**kal (wo/wohin?).\n- Ich fahre ==heute== ==wegen des Regens== ==mit dem Bus== ==ins Büro==.\n- Or start with one of them: **Heute** fahre ich mit dem Bus ins Büro.')],
faelle:[
N('Die vier Fälle · the four cases','| |Frage|Rolle\n|Nominativ|Wer? Was?|subject, doing the action\n|Akkusativ|Wen? Was?|target of the action\n|Dativ|Wem?|recipient of the outcome\n|Genitiv|Wessen?|possession'),
N('Artikel · articles','| |M|F|N|Pl\n|Nom|der / ein|die / eine|das / ein|die\n|Akk|den / einen|die / eine|das / ein|die\n|Dat|dem / einem|der / einer|dem / einem|den (+n)\n|Gen|des / eines (+s)|der / einer|des / eines (+s)|der'),
N('Endungen merken · endings to remember','- Only **masculine** changes in Akkusativ: der → **den**\n- Dative plural: the noun gets **-n** → mit den Kinder**n**\n- Genitive M/N: the noun gets **-s / -es** → des Mann**es**, des Auto**s**')],
praep:[
N('Akkusativ-Präpositionen','**DOGFU**: durch, ohne, gegen, für, um\n- Ich gehe **durch den** Park.'),
N('Dativ-Präpositionen','aus, außer (except), bei, mit, nach, seit, von, zu, gegenüber (across from)\n- Ich fahre **mit dem** Bus.\n- **nach** for countries and cities without an article: nach Zürich, nach Spanien.'),
N('Wechselpräpositionen · 2-way','an, auf, hinter, in, neben, über, unter, vor, zwischen\n- **Wohin?** (direction, movement) → Akkusativ: Ich setze das Glas **auf den** Tisch.\n- **Wo?** (location) → Dativ: Das Glas steht **auf dem** Tisch.\nentlang (along) is special: den Fluss **entlang** (Akk, after the noun).'),
N('Kurzformen · contractions','| |Kurzform\n|bei dem|beim\n|von dem|vom\n|zu dem|zum\n|zu der|zur\n|an dem|am\n|in dem|im\n|an das|ans\n|in das|ins\nPlural never contracts: bei den, von den, zu den.')],
verben:[
N('Präsens · present endings','Stem + ending: ich **-e**, du **-st**, er/sie/es **-t**, wir **-en**, ihr **-t**, sie/Sie **-en**\n- mach**e**, mach**st**, mach**t**, mach**en**, mach**t**, mach**en**'),
N('Regelmäßig / unregelmäßig','**Regular (weak):** the stem stays the same, just add endings.\n**Irregular (strong):** the stem changes → fahren, du f**ä**hrst, er f**u**hr.'),
N('Perfekt · spoken past','Subject + **haben/sein** (position 2) + … + **Partizip II** (end).\n- Ich **habe** einen Kaffee **getrunken**.\n- **sein** for movement or a change of state: Ich **bin** nach Hause **gegangen**.'),
N('Partizip II','- Regular: **ge** + stem + **t** → gemacht\n- Irregular: **ge** + (changed) stem + **en** → gegangen, geschrieben\n- Separable: prefix + **ge** + … → aufgemacht, eingekauft\n- No ge- with be-, emp-, ent-, er-, ge-, miss-, ver-, zer- and -ieren → besucht, verstanden, studiert'),
N('Präteritum · simple past','Mostly used in writing. In speech: **sein, haben** and **modal verbs** → ich war, ich hatte, ich konnte.\n- Regular: stem + -te, -test, -te, -ten, -tet, -ten → ich mach**te**'),
N('Modalverben','They express necessity, permission, ability, preference and obligation.\nkönnen (can), müssen (must), dürfen (may), wollen (want), sollen (should), mögen (like)\n- Modal verb in position 2, the other verb as **infinitive at the end**: Ich **muss** heute **arbeiten**.')],
konn:[
N('Koordinierend · Konjunktionen','Verb stays in **position 2**. Remember **ADUSO**: aber, denn (doch), und, sondern, oder.\n- Ich bin müde, **aber** ich **lerne** noch.'),
N('Subordinierend · Subjunktionen','Verb moves to the **end**.\n- Ich lerne Deutsch, **weil** ich es jeden Tag **brauche**.'),
N('Adverbial · Konjunktionaladverbien','The connector takes position 1, so the **verb comes next and the subject right after**.\n- Es regnet, **deshalb** **nehme** ==ich== den Bus.')],
'pin:fragen':[
N('Höflich fragen · asking politely','- **Kannst du bitte** das Fenster aufmachen?\n- **Bring mir bitte** einen Kaffee. (du)\n- **Bringen Sie mir bitte** einen Kaffee. (Sie, polite)'),
N('Ja sagen · saying yes','Ja! · Gute Idee! · Das passt! · Klar! · Gerne! · Natürlich!\n- **Lass uns** das machen! (Lass uns + Infinitiv = Let\'s …)')]
},
sentences:['Ich | fahre | heute | wegen des Regens | mit dem Bus | ins Büro.','Heute | fahre | ich | mit dem Bus | ins Büro.','Ich | bleibe | zu Hause, | weil | ich | müde | bin.','Das ist | der Mann, | der | in Zürich | wohnt.','Es regnet, | deshalb | trinke | ich | einen Tee.','Ich | weiß, | dass | du | heute | arbeiten | musst.','Ich | habe | gestern | einen Kuchen | gebacken.','Ich | muss | morgen | früh | aufstehen.'],

contr:[['bei dem','beim'],['von dem','vom'],['zu dem','zum'],['zu der','zur'],['an dem','am'],['in dem','im'],['an das','ans'],['in das','ins']],
conn:{koord:['aber','denn','doch','oder','sondern','und'],
sub:['als','bevor','bis','da','damit (so that)','dass','ehe','falls','indem','nachdem','ob','obgleich','obwohl','obschon','seit','seitdem (since)','sobald','sodass','sofern','solange','sooft','soweit','soviel','während','weil','wenn','wie','wohingegen'],
adv:['allerdings','also','andererseits','anschließend','außerdem','beziehungsweise','dabei','dadurch','dafür','dagegen','damit (with that)','danach','dann','darauf','darum','davor','dazu','demnach','deshalb','deswegen','einerseits','entweder … oder','ferner','folglich','genauso','immerhin','inzwischen','jedoch','schließlich','seitdem (since then)','somit','sonst','später','trotzdem','vorher','weder … noch','zuerst','zuvor','zwar']},
verbs:[['machen','make, do','machte','gemacht','haben'],['gehen','go','ging','gegangen','sein'],['fahren','drive, go','fuhr','gefahren','sein'],['kommen','come','kam','gekommen','sein'],['sein','be','war','gewesen','sein'],['haben','have','hatte','gehabt','haben'],['werden','become','wurde','geworden','sein'],['schreiben','write','schrieb','geschrieben','haben'],['lesen','read','las','gelesen','haben'],['sprechen','speak','sprach','gesprochen','haben'],['essen','eat','aß','gegessen','haben'],['trinken','drink','trank','getrunken','haben'],['kaufen','buy','kaufte','gekauft','haben'],['einkaufen','go shopping','kaufte ein','eingekauft','haben'],['aufstehen','get up','stand auf','aufgestanden','sein'],['besuchen','visit','besuchte','besucht','haben'],['studieren','study','studierte','studiert','haben'],['verstehen','understand','verstand','verstanden','haben'],['bleiben','stay','blieb','geblieben','sein'],['können','can','konnte','gekonnt','haben'],['müssen','must','musste','gemusst','haben'],['wissen','know (a fact)','wusste','gewusst','haben']].map(([inf,en,prat,p2,aux])=>({inf,en,prat,p2,aux})),
pins:[{id:'fragen',title:'Fragen, Ja & Nein'}],links:{...REC_MUSIC},myrecs:[],inbox:[],prac:{},seen:{},roomLinks:{...ROOM_MUSIC},roomOn:true,musicV:1};

/* ---------- lesson notes (Sommer + Herbst), added as content v2 ---------- */
const M=(id,t,b)=>({id:'v2-'+id,t,b});
const ADD2={
notes:{
faelle:[
M('adj-def','Adjektive nach der / die / das','| |M|F|N|Pl\n|Nom|der alt**e** Mann|die alt**e** Frau|das alt**e** Haus|die alt**en** Häuser\n|Akk|den alt**en** Mann|die alt**e** Frau|das alt**e** Haus|die alt**en** Häuser\n|Dat|dem alt**en** Mann|der alt**en** Frau|dem alt**en** Haus|den alt**en** Häusern\n|Gen|des alt**en** Mannes|der alt**en** Frau|des alt**en** Hauses|der alt**en** Häuser\nRule: **-e** in the five easy spots (all Nominativ singular + Akkusativ F/N). Everywhere else **-en**. Also after dieser, jeder, welcher.'),
M('adj-ind','Adjektive nach ein / kein / mein','| |M|F|N|Pl\n|Nom|ein klein**er** Hund|eine klein**e** Katze|ein klein**es** Pferd|keine klein**en** Tiere\n|Akk|einen klein**en** Hund|eine klein**e** Katze|ein klein**es** Pferd|keine klein**en** Tiere\n|Dat|einem klein**en** Hund|einer klein**en** Katze|einem klein**en** Pferd|keinen klein**en** Tieren\n|Gen|eines klein**en** Hundes|einer klein**en** Katze|eines klein**en** Pferdes|keiner klein**en** Tiere\nWhere ein has no ending, the adjective shows the gender: ein klein**er** Hund (der), ein klein**es** Pferd (das).\n- Es gibt ==einen sonnigen== Tag und ==ein schönes== Mädchen mit ==einem kleinen== Hund.\n- Ich sehe auch ==ein altes== Gebäude.'),
M('adj-null','Adjektive ohne Artikel','| |M|F|N|Pl\n|Nom|heiß**er** Kaffee|frisch**e** Milch|kalt**es** Wasser|rot**e** Äpfel\n|Akk|heiß**en** Kaffee|frisch**e** Milch|kalt**es** Wasser|rot**e** Äpfel\n|Dat|heiß**em** Kaffee|frisch**er** Milch|kalt**em** Wasser|rot**en** Äpfeln\n|Gen|heiß**en** Kaffees|frisch**er** Milch|kalt**en** Wassers|rot**er** Äpfel\nNo article, so the adjective does its job and takes the der/die/das ending (heiß**er** like de**r**).'),
M('adj-alone','Adjektiv allein · no ending','After sein, werden, finden the adjective has **no ending**:\n- Die Pflanze ist exotisch. (not: exotische)\n- But with a noun after it: Das ist eine ==italienische== Stadt.'),
M('n-dekl','n-Deklination','Some masculine nouns add **-(e)n** everywhere except Nominativ singular:\n- der Name → den Name**n**, dem Name**n**, des Name**ns**\n- Ich weiß den Namen des Spiels nicht.\nAlso: der Mensch, der Junge, der Kollege, der Nachbar, der Student, der Herr.'),
M('hints','Welcher Fall? Schnelle Hinweise','- **Es gibt / Ich sehe** → Akkusativ: Ich sehe einen Mann und einen Hai.\n- **Auf dem Bild ist** → Nominativ: Auf dem Bild ist ein Mann.\n- **Dativ-Verben:** helfen, danken, gefallen, gehören, antworten → Ich helfe meinem Nachbarn.\n- **wegen** + Genitiv: wegen des Wetters, wegen der Freundin\n- Genitiv = whose: für den Geburtstag **meines Freundes**, die Ehefrau **des Malers**')],
praep:[
M('seit-vor','seit oder vor? · time','Both take Dativ.\n- **vor** = ago, finished: Vor drei Tagen habe ich es gekauft.\n- **seit** = since / for, still happening: Seit sechs Jahren lerne ich Deutsch.'),
M('wohin','zu, nach, bei, von, aus','- **zu** people and places: zum Arzt, zum Bahnhof, zur Nachbarin, zu den Freunden\n- **nach** cities and countries without article: nach Deutschland, nach Berlin; also nach Hause\n- **bei** at someone\'s place: beim Arzt, bei der Nachbarin, bei ihr (at her place)\n- **von** from (a person or place): vom Arzt, vom Stadion\n- **aus** from (origin): aus Mexiko, aus der Nähe von Frankfurt'),
M('im-am','im, am, ans, ins','- im Garten (der), im Meer (das), im Beet (das)\n- **Wohin?** ans Meer fahren, ins Bett gehen\n- **Wo?** am Meer sein, im Bett liegen')],
verben:[
M('sein-haben','Perfekt: sein oder haben?','**sein**: movement from A to B, or a change of state.\n- Ich bin nach Hause gegangen. Er ist eingeschlafen. Das Kaninchen ist gestorben.\n- Also bleiben, passieren, werden, sein: Sie sind zu Hause geblieben.\n**haben**: everything else, and when there is an Akkusativ object or the verb is reflexive.\n- Sie hat die Vase zerbrochen. (Akk) · Die Vase ist zerbrochen. (change of state)\n- Ich habe das Auto in die Garage gefahren. (Akk)\n- Wir haben getanzt. Ich habe mich erinnert.\n- stehen, liegen, sitzen: hat gestanden (in Switzerland often: ist gestanden)'),
M('trennbar','Trennbare Verben','The prefix goes to the **end** of a main clause.\n- Ich mache das Fenster **auf**. Die Bahn kommt um halb zehn **an**.\n- Das Fest findet am Samstag **statt**. Hast du am Wochenende etwas **vor**?\n- Common prefixes: an-, auf-, aus-, ein-, mit-, vor-, zurück-, los-, teil-, statt-, fern-, nach-, bei-\n- In a Nebensatz it stays together: …, wenn ich **aufstehe**.\n- Perfekt: auf**ge**macht, um**ge**zogen, bei**ge**bracht'),
M('untrennbar','Untrennbare Verben','be-, emp-, ent-, er-, ge-, miss-, ver-, zer- never split and have **no ge-**: bekommen, verstehen, empfehlen → empfohlen.\n- beitragen (trennbar: trägt … bei) vs. betragen (untrennbar: beträgt = amounts to)'),
M('modal-tab','Modalverben im Präsens','| |dürfen|müssen|wollen|können\n|ich|darf|muss|will|kann\n|du|darfst|musst|willst|kannst\n|er/sie|darf|muss|will|kann\n|wir|dürfen|müssen|wollen|können\n|ihr|dürft|müsst|wollt|könnt\n|sie/Sie|dürfen|müssen|wollen|können\nich and er/sie have the **same form**, with no -t.'),
M('wissen','wissen oder kennen?','- **wissen** = know a fact: ich weiß, du weißt, er weiß, wir wissen, ihr wisst, sie wissen\n- Wir wissen, wann der Zug aus Genf ankommt.\n- **kennen** = know a person, place or word: Ich kannte diese Wörter nicht.'),
M('lassen','lassen · get something done','- Ich lasse mein Auto reparieren.\n- Er lässt sich ein Tattoo stechen.\n- ich lasse, du lässt, er lässt'),
M('treffen','treffen oder sich treffen?','- Ich habe meinen Freund getroffen. → by chance\n- Ich habe mich mit meinem Freund getroffen. → planned')],
konn:[
M('weil-denn','weil, denn, wegen','- **weil** → verb at the end: …, weil er mit Senioren geredet **hat**.\n- **denn** → normal order: …, denn er **hat** mit Senioren geredet.\n- **wegen** + noun in Genitiv: wegen des Wetters'),
M('obwohl','obwohl und trotzdem','Both show an unexpected result.\n- **obwohl** starts a Nebensatz: Laura feiert eine Party, obwohl sie Fieber **hat**.\n- **trotzdem** joins two main clauses: Frau Winter ist krank. Trotzdem **geht** sie ins Büro.'),
M('damit','damit und um … zu · purpose','- **damit** + Nebensatz: …, damit ich mein Deutsch verbessern **kann**.\n- **um … zu** when the subject stays the same: Ich nehme Kurse, um B2 **zu erreichen**.'),
M('ob','ob · indirect questions','A yes/no question inside a sentence uses **ob**, verb at the end, and a **full stop**.\n- Ich möchte wissen, ob du die Hausaufgaben gemacht hast.'),
M('ns-perfekt','Nebensatz im Perfekt','The helper verb goes to the **very end**:\n- …, weil ich lange mit Kunden telefoniert **habe**.\n- …, dass sie gestern ins Kino gegangen **ist**.'),
M('pos1','Kleine Wörter auf Position 1','vielleicht (maybe), übrigens (by the way), allerdings (however), eigentlich (actually)\n- Allerdings **ist** sie zu teuer. Vielleicht **können** wir uns treffen.\n- With a comma it doesn\'t count: Übrigens, **hast** du den Film gesehen?')],

satzbau:[
M('klammer','Die Satzklammer · word order at a glance','Think of a main clause as **slots**. The conjugated verb always sits in **slot 2**. Whatever belongs to it (infinitive, Partizip, separable prefix) waits at the **very end**. Together they make a bracket around the rest.\n| |Position 1|Verb (2)|Mitte|Ende\n|Präsens|Ich|**trinke**|heute einen Kaffee.|–\n|Inversion|==Heute==|**trinke**|ich einen Kaffee.|–\n|Modalverb|Ich|**muss**|heute einen Kaffee|**trinken**.\n|Perfekt|Ich|**habe**|heute einen Kaffee|**getrunken**.\n|trennbar|Ich|**kaufe**|heute im Supermarkt|**ein**.\n|W-Frage|Wann|**trinkst**|du einen Kaffee?|–\n|Ja/Nein-Frage|–|**Trinkst**|du einen Kaffee?|–\n- Position 1 holds **exactly one** block: the subject, a time word, an object, or a whole Nebensatz.\n- und, aber, oder, denn, sondern sit **before** position 1 (position 0) and change nothing.\n- In a Nebensatz the bracket closes completely: …, weil ich heute einen Kaffee **getrunken habe**.'),
M('mitte','Was kommt in die Mitte? · the middle','- **Pronouns first**, short before long: Ich gebe ==es ihm== morgen.\n- Two nouns: **Dativ before Akkusativ** (person, then thing): Ich gebe ==dem Mann== ==das Buch==.\n- Two pronouns: **Akkusativ before Dativ**: Ich gebe ==es== ==ihm==.\n- Then the extras in TeKaMoLo order: heute · wegen des Regens · mit dem Bus · ins Büro.\n- **nicht** goes to the end of the middle, just before the verb at the end: Ich habe das Buch **nicht** gelesen. Or right before the word it negates: Ich fahre **nicht** mit dem Bus, sondern mit dem Rad.')],
faelle:[
M('adj-weg','Welche Adjektivendung? In 3 Fragen','- **A der-word in front** (der, dieser, jeder, welcher)? The article already shows the case, so the adjective takes the easy ending: **-e** or **-en**.\n- **An ein-word in front** (ein, kein, mein …)? Same as der-words, except in the 3 spots where ein has no ending (Nom M, Nom N, Akk N). There the adjective shows the gender: ein klein**er** Hund, ein klein**es** Pferd.\n- **No article?** The adjective takes the der/die/das ending itself: heiß**er** Kaffee (der), kalt**es** Wasser (das).\n- Describing people: der Mann **in** Schwarz · der Mann **im** schwarz**en** T-Shirt (in dem → -en).')]},

M('zeit','Zeit-Konnektoren · when, before, after','All of them start a Nebensatz, so the **verb goes to the end**.\n|Wort|Bedeutung|Beispiel\n|wenn|when (every time, or future)|Wenn das Wetter schön ist, gehe ich segeln.\n|als|when (one time, in the past)|Als ich es letztes Jahr versucht habe, …\n|bevor|before|Bevor ich angefangen habe, musste ich früh aufstehen.\n|nachdem|after (this part happened first)|Nachdem ich gefrühstückt habe, fahre ich los.\n|sobald|as soon as|Sobald du fertig bist, fahren wir.\n|während|while, at the same time|Während du lernst, mache ich Frühstück.\n|seit / seitdem|since, ever since|Seitdem wir zusammen sind, …\n- **als or wenn?** One time in the past → **als**. Repeated or future → **wenn**.\n- Your homework mix-ups: bevor → **nachdem / sobald** (after, not before) · während → **seitdem** (ever since we\'re together).'),
M('falls','wenn, falls, weil oder da?','- **wenn**: a condition or a time: **Wenn** das Wetter schön ist, fahren wir.\n- **falls**: in case. Maybe it happens, maybe not: **Falls** ich etwas verpasse, lese ich es im Protokoll nach.\n- **weil / da**: a reason (it is a fact). **da** often starts the sentence: **Da** es kaum Parkplätze gibt, kommen Sie besser mit dem Bus.\n- All four send the **verb to the end**.\n- Your homework fix: falls es kaum Parkplätze gibt → **weil / da** es kaum Parkplätze gibt, because it is a fact, not a maybe.'),
M('damit2','damit hat zwei Jobs','- **damit** = so that (Subjunktion) → verb at the end: Wir lernen Deutsch, **damit** wir besser kommunizieren **können**.\n- **damit** = with that (Adverb) → position 1, verb next: Ich habe eine neue Brille. **Damit kann** ich besser lesen.')],
satzbau:[
M('rel-dat','Relativsatz mit Dativ & Präposition','The pronoun gets its **case from inside** the relative clause: from the verb or the preposition there.\n- **Dativ verbs** (gefallen, helfen, geben, schenken, danken): Das ist der Mann, ==dem== ich gefallen möchte. Das sind die Leute, ==denen== ich beim Umzug geholfen habe.\n- **Preposition first**, then the pronoun: Das ist der Mann, **mit dem** ich tanzen möchte. · Die Frau, **von der** ich dir erzählt habe. · Die Leute, **auf die** ich eine Stunde gewartet habe.\n- Two sentences into one: Die Nachbarn sind erst zwei Wochen hier. Du hast mit ihnen gesprochen. → Die Nachbarn, **mit denen** du gesprochen hast, sind erst zwei Wochen hier.\n- The relative clause sits **right after its noun**. Only if just one word would come after it, that word goes first: Sie kaufte in dem Geschäft **ein**, das ihre Freundin empfohlen hatte.')],
verben:[
M('perf-und','Perfekt: zwei Verben mit und','- **Same helper** for both → say it once: Sie **hat** Tee getrunken und ein Buch gelesen.\n- **Different helpers** → say both: Sie **ist** in die Stadt gegangen und **hat** Tee getrunken.\n- Sie ist ins Bett gegangen und (ist) sofort eingeschlafen. → both sein, so once is enough.')],
'pin:meinung':[
M('m3','Zustimmen, widersprechen, ja aber','- **Zustimmen:** Ich sehe das genauso. · Da bin ich ganz deiner Meinung. · Da hast du recht.\n- **Ja, aber:** Das stimmt zwar, aber … · Im Prinzip ja, aber … · Da hast du natürlich recht, jedoch …\n- **Widersprechen:** Das sehe ich anders. · Da bin ich anderer Meinung. · Ich finde nicht, dass …\n- **Zu Wort kommen:** Darf ich kurz etwas dazu sagen? · Entschuldige, wenn ich dich unterbreche, aber …')]},

  const chord=()=>{if(master!==out)return;const t=AC.currentTime,c=M.ch[i++%M.ch.length];[c[0]-12,...c].forEach((m,j)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=j?'triangle':'sine';o.frequency.value=hz(m);o.detune.value=(Math.random()-.5)*8;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(j?.035:.06,t+1.3);g.gain.linearRampToValueAtTime(0,t+M.sec+.4);o.connect(g);g.connect(lp);o.start(t);o.stop(t+M.sec+.6)});
    if(Math.random()<.7){const o=AC.createOscillator(),g=AC.createGain(),t2=t+M.sec*.5;o.type='sine';o.frequency.value=hz(pick(c)+12);g.gain.setValueAtTime(0,t2);g.gain.linearRampToValueAtTime(.03,t2+.05);g.gain.exponentialRampToValueAtTime(.0005,t2+1.8);o.connect(g);g.connect(lp);o.start(t2);o.stop(t2+2)}};
  chord();loop=setInterval(chord,M.sec*1000);
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  if(M.rain){let last=0;for(let n=0;n<len;n++){last=(last+.02*(Math.random()*2-1))/1.02;d[n]=last*3.2+(Math.random()*2-1)*.04}}else{for(let n=0;n<len;n++)d[n]=Math.random()<.0006?(Math.random()*2-1)*.6:(Math.random()*2-1)*.006}
  noiseSrc=AC.createBufferSource();noiseSrc.buffer=buf;noiseSrc.loop=true;const ng=AC.createGain();ng.gain.value=M.rain?.5:.35;const nf=AC.createBiquadFilter();nf.type=M.rain?'lowpass':'bandpass';nf.frequency.value=M.rain?1800:2500;noiseSrc.connect(nf);nf.connect(ng);ng.connect(master);noiseSrc.start();
  playing=k;document.body.classList.add('playing')}catch(e){playing=null}}

/* ---------- YouTube sound only (hidden player, link saved per device) ---------- */
let YTP=null,ytReady=null,ytOn=false,ytMsg='',ytKey=null;
function ytParse(u){try{const x=new URL(u.trim());if(!/(^|\.)youtube\.com$|(^|\.)youtu\.be$|(^|\.)youtube-nocookie\.com$/.test(x.hostname))return null;
  let v=x.searchParams.get('v');const list=x.searchParams.get('list');
  if(x.hostname.endsWith('youtu.be'))v=x.pathname.slice(1).split('/')[0];
  const m=x.pathname.match(/\/(?:embed|shorts|live)\/([\w-]{11})/);if(m)v=m[1];
  v=v&&/^[\w-]{11}$/.test(v)?v:null;const L=list&&!(v&&/^RD/.test(list))?list:null;return v||L?{v,list:L}:null}catch(e){return null}}
function ytLoadApi(){if(ytReady)return ytReady;ytReady=new Promise(res=>{window.onYouTubeIframeAPIReady=res;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{ytReady=null;ytSet(false,'Could not reach YouTube. Check your internet.')};document.head.appendChild(s)});return ytReady}
function ytSet(on,msg){ytOn=on;ytMsg=msg||'';document.body.classList.toggle('ytplaying',on);document.querySelectorAll('.rec[data-key]').forEach(c=>{const pl=on&&c.dataset.key===ytKey;c.classList.toggle('playing',pl);c.setAttribute('aria-pressed',pl);const sm=c.querySelector('.st');if(sm)sm.textContent=pl?' · playing ♪':(c.dataset.has?' · tap to play':' · add a link below')});musicUI();const b=$('#ytbtn');if(b){b.textContent=on?'❚❚ Pause':'▶ Play';b.setAttribute('aria-pressed',on)}const m=$('#ytstate');if(m)m.textContent=ytMsg}
let fadeT=null;
function ytFade(to,ms,done){clearInterval(fadeT);if(!YTP||typeof YTP.getVolume!=='function'){done&&done();return}let v=YTP.getVolume();const steps=Math.max(1,Math.round(ms/60)),dv=(to-v)/steps;let i=0;fadeT=setInterval(()=>{i++;v+=dv;try{YTP.setVolume(Math.max(0,Math.min(100,Math.round(v))))}catch(e){}if(i>=steps){clearInterval(fadeT);done&&done()}},60)}
function playFaded(url,key){const fading=YTP&&ytOn&&YTP._src!==url&&typeof YTP.getVolume==='function';ytKey=key;ytSet(true,'Loading…');if(fading)ytFade(0,700,()=>ytPlay(url,key));else ytPlay(url,key)}
let gestured=false,muted=LS.get('zs-mute')===true;
function setMuted(m){muted=m;LS.set('zs-mute',m);musicUI()}
function musicUI(){const mb=$('#mute');if(mb){mb.innerHTML=muted?ICON.spkx:ICON.spk;mb.setAttribute('aria-pressed',muted);mb.setAttribute('aria-label',muted?'Music is off. Turn room music on':'Turn all music off');mb.title=muted?'Music off · tap for room music':'Mute all music'}
  const pb=document.querySelector('[data-act=stop],[data-act=playmusic]');if(pb){pb.dataset.act=ytOn?'stop':'playmusic';pb.textContent=ytOn?'■ Stop music':'▶ Play music'}}
function roomMusic(){if(!gestured||muted||!S.roomOn||!$('#gate').hidden)return;const url=(S.roomLinks||{})[room];if(!ytParse(url||''))return;const key='room:'+room;if(ytKey===key&&ytOn)return;playFaded(url,key)}
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{if(gestured)return;gestured=true;setTimeout(roomMusic,50)},{capture:true}));
async function ytPlay(url,key,fadeIn){const p=ytParse(url||'');if(!p){ytSet(false,'This record has no YouTube link yet.');return}ytKey=key;
  stopMusic();ytSet(true,'Loading…');await ytLoadApi();
  if(YTP&&YTP._src===url){YTP.setVolume(fadeIn?0:Math.round(vol*100));YTP.playVideo();if(fadeIn)ytFade(Math.round(vol*100),2200);return}
  if(YTP){try{YTP.destroy()}catch(e){}YTP=null}
  let host=$('#ytp');if(!host){host=document.createElement('div');host.id='ytp';host.setAttribute('aria-hidden','true');document.body.appendChild(host)}host.innerHTML='<div id="ytpi"></div>';
  const pv={autoplay:1,playsinline:1,controls:0,disablekb:1};if(p.list){pv.listType='playlist';pv.list=p.list;pv.loop=1}
  YTP=new YT.Player('ytpi',{width:200,height:200,videoId:p.v||undefined,playerVars:pv,events:{
    onReady:e=>{e.target.setVolume(fadeIn?0:Math.round(vol*100));e.target.playVideo();if(fadeIn)ytFade(Math.round(vol*100),2200)},
    onStateChange:e=>{const st=e.data;if(st===1)ytSet(true,'Playing ♪');else if(st===2)ytSet(false,'Paused');else if(st===0){if(!p.list){e.target.seekTo(0);e.target.playVideo()}}},
    onError:e=>{ytSet(false,[101,150].includes(e.data)?'This video doesn\'t allow playing outside YouTube. Try another link.':'YouTube could not play this link.')}}});
  YTP._src=url}
function ytPause(){if(YTP&&YTP.pauseVideo)YTP.pauseVideo();ytSet(false,'Paused')}

/* ---------- Mini-Prüfung: mixed quiz from all notes ---------- */
const bare=w=>String(w).replace(/\s*\(.*?\)/g,'').trim();
const norm=s=>String(s).toLowerCase().replace(/[.!?,]/g,'').replace(/^(er|sie|es)\s+/,'').replace(/\s+/g,' ').trim();
function roomOf(k){return k.startsWith('pin:')?(k==='pin:fragen'?'fragen':isSpeak(k.slice(4))?'pult':'pin'):k}
function openNote(k,id){const room=roomOf(k);openPanel(room);if(room==='pin'||room==='pult')pinOpen=k.slice(4);tab='notes';render();const el=id&&document.querySelector(`[data-nid="${id}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}}
function exGen(){const G=[],notes=[];for(const [k,arr] of Object.entries(S.notes)){if(k==='vocab')continue;(arr||[]).forEach(n=>{if(n.t&&n.b)notes.push([k,n])})}
  if(notes.length)G.push([3,()=>{const [k,n]=pick(notes);return {key:'n'+n.id,kind:'self',tag:(ST[roomOf(k)]||{}).n||'',q:`What do you remember about <b>${esc(n.t)}</b>?`,hint:'Think of the rule and one example, then check.',reveal:md(n.b),seen:n.id,ref:[k,n.id],label:n.t}}]);
  if(S.vocab.length)G.push([2,()=>{const v=pick(S.vocab),de=Math.random()<.5;return {key:'v'+v.id+de,kind:'self',tag:'Wortschatz'+(v.topic?' · '+v.topic:''),q:`<span lang="${de?'de':'en'}" style="font-size:24px">${esc(de?v.de:v.en)}</span>`,hint:de?'What does it mean in English?':'How do you say it in German?',reveal:`<p style="font-size:20px;text-align:center"><b>${esc(de?v.en:v.de)}</b></p>`,seen:'vt:'+(v.topic||'Andere'),ref:['vocab'],label:v.de}}]);
  const pre=Object.entries(S.preps).flatMap(([g,ws])=>(ws||[]).map(w=>[w,g]));if(pre.length)G.push([1,()=>{const [w,g]=pick(pre);return {key:'p'+w,kind:'mc',tag:'Präpositionen',q:`<b lang="de">${esc(w)}</b> takes which case?`,opts:[['akk','Akkusativ'],['dat','Dativ'],['wech','Wechsel: Wo? Dat · Wohin? Akk']],ans:g,room:'praep',ref:['praep'],label:w}}]);
  const con=Object.entries(S.conn).flatMap(([g,ws])=>(ws||[]).map(w=>[w,g]));if(con.length)G.push([1,()=>{const [w,g]=pick(con);return {key:'c'+w,kind:'mc',tag:'Konnektoren',q:`After <b lang="de">${esc(bare(w))}</b>, where does the verb go?`,opts:[['koord','Stays in position 2'],['sub','Goes to the end'],['adv','Right after it, then the subject']],ans:g,room:'konn',ref:['konn'],label:bare(w)}}]);
  const vb=S.verbs.filter(v=>v.inf&&v.p2);if(vb.length)G.push([1,()=>{const v=pick(vb),aux=v.aux==='sein'?'ist':'hat';return {key:'vb'+v.inf,kind:'type',tag:'Verben · Perfekt',q:`<b lang="de">${esc(v.inf)}</b> (${esc(v.en||'')}) in the Perfekt: er …`,ph:'e.g. hat gemacht',ans:[aux+' '+v.p2],room:'verben',ref:['verben'],label:v.inf}}]);
  if(ADJ.length)G.push([1,()=>{const a=pick(ADJ);return {key:'a'+a[0],kind:'type',tag:'Fälle · Adjektivendung',q:`<span lang="de">${esc(a[0])}<b>___</b> ${esc(a[1])}</span><br><span class="hint">${esc(a[3])}</span>`,ph:'just the ending, e.g. en',ans:[a[2]],room:'faelle',ref:['faelle'],label:a[0]+'_ '+a[1]}}]);
  return G}
function exNext(){const E=P.ex,G=exGen(),tot=G.reduce((a,g)=>a+g[0],0);let q;
  for(let t=0;t<10;t++){let r=Math.random()*tot,i=0;while(i<G.length-1&&r>=G[i][0]){r-=G[i][0];i++}q=G[i][1]();if(!E.recent.includes(q.key))break}
  E.recent=[q.key,...E.recent].slice(0,15);E.q=q;E.shown=false;E.res=null;E.pickd=null;E.typed=''}
function exGrade(ok){const E=P.ex,q=E.q,now=Date.now();E.n++;if(ok){E.score++;registerCorrect(1)}else E.miss.push({label:q.label||q.tag,tag:q.tag,ref:q.ref});if(q.seen)S.seen[q.seen]=now;if(q.room)S.prac[q.room]=now;save()}
function examV(){const E=P.ex;
  if(!E)return `<div class="game"><div class="big" style="font-size:28px;margin:0 0 6px">Mini-Prüfung</div><p>Questions from <b>all</b> your notes, mixed up: rules, words, prepositions, connectors, verbs and adjective endings.</p><p class="hint">It never runs out. Stop whenever you like and see what to look at again.</p><button class="btn main" data-act="exstart">Start</button>${S.lastExam?`<p class="hint" style="margin-top:14px">Last round: ${S.lastExam.score} of ${S.lastExam.n} right, ${new Date(S.lastExam.t).toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</p>`:''}</div>`;

    return `<div class="game"><div class="big" style="font-size:32px;margin:0">${E.score} / ${E.n}</div><p>${E.n?pct+'% right. '+(pct>=80?'Sehr gut!':pct>=50?'Gut gemacht!':'Every round helps. Weiter so!'):'No questions answered this time.'}</p></div>
    ${miss.length?`<h3 style="margin:18px 0 8px">Worth another look</h3><div class="pins">${miss.map(m=>`<button class="pinc" data-act="exopen" data-k="${esc(m.ref[0])}" data-id="${esc(m.ref[1]||'')}">${esc(m.label)}<small>${esc(m.tag)}</small></button>`).join('')}</div>`:''}
    <div class="row" style="margin-top:16px"><button class="btn main" data-act="exstart">New round</button></div>`}
  const q=E.q;let body='';
  if(q.kind==='self')body=E.shown?`<div class="note" style="text-align:left;margin-top:12px">${q.reveal}</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-act="exself" data-v="0">Not yet</button><button class="btn main" data-act="exself" data-v="1">I knew it!</button></div>`:`<p class="hint">${q.hint}</p><button class="btn main" data-act="exreveal">Show answer</button>`;

  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="hint" style="margin:0">Question ${E.res?E.n:E.n+1} · ${E.score} right so far</span><button class="btn sm" data-act="exend">End exam</button></div><div class="game"><span class="hint">${esc(q.tag)}</span><div style="font-size:20px;margin:6px 0 10px">${q.q}</div>${body}</div>`}

function fNew(kind){P.kind=kind||P.kind||'def';if(P.kind==='adj'){P.hid=[];P.q=shuffle(ADJ);P.cur=P.q.pop();P.res=null;return}const A=ART[P.kind],keys=[];A.forEach((r,i)=>r.forEach((v,j)=>v!=='–'&&keys.push(i+'-'+j)));P.hid=shuffle(keys).slice(0,7);P.val={};P.res=null}
function faelleV(){if(tab==='notes')return notesV('faelle');if(!P.hid)fNew();const seg=`<div class="seg" style="justify-content:center"><button data-act="fkind" data-v="def" class="${P.kind==='def'?'on':''}">der · die · das</button><button data-act="fkind" data-v="ind" class="${P.kind==='ind'?'on':''}">ein · eine</button><button data-act="fkind" data-v="adj" class="${P.kind==='adj'?'on':''}">Adjective endings</button></div>`;
  if(P.kind==='adj'){const [pre,post,end,hint]=P.cur;return `<div class="game">${seg}<p class="hint">Which ending is missing? <b>${hint}</b></p><div class="big" style="font-size:clamp(24px,4.5vw,34px)">${esc(pre)}<u>${P.res==null?'&nbsp;?&nbsp;':esc(end)}</u> ${esc(post)}</div><div class="jars" style="grid-template-columns:repeat(5,minmax(0,1fr))">${['e','en','er','es','em'].map(e=>`<button data-act="adjans" data-v="${e}" style="background:var(--sage)" ${P.res!=null?'disabled':''}>-${e}</button>`).join('')}</div><p class="fb ${P.res===true?'ok':P.res===false?'bad':''}" aria-live="polite">${P.res===true?'Richtig!':P.res===false?'The right ending is: -'+end:''}</p>${P.res===false?'<button class="btn main" data-act="adjnext">Next</button>':''}</div>`+scoreLine()+'<p class="hint">The tables are under Notes: after der/die/das, after ein/kein/mein, and without an article.</p>'}
  const A=ART[P.kind];

  <p class="fb ${P.res?(P.score===P.hid.length?'ok':'bad'):''}" aria-live="polite">${P.res?`${P.score} of ${P.hid.length} correct`+(P.score===P.hid.length?' – perfect!':''):''}</p>
  <div class="row" style="justify-content:center"><button class="btn" data-act="fnew">New round</button>${P.res?'':'<button class="btn main" data-act="fcheck">Check</button>'}</div></div><p class="hint">Dative plural nouns add -n; genitive M/N nouns add -s/-es.</p>`}

/* Präpositionen */
const allOf=list=>Object.entries(S[list]).flatMap(([g,a])=>a.map(w=>({w,g})));
function qNext(list){if(!P.q||!P.q.length)P.q=shuffle(allOf(list));P.cur=P.q.pop();P.res=null}
function cNext(){P.cur=pick(S.contr);P.res=null;const others=shuffle([...new Set(S.contr.map(c=>c[1]).filter(x=>x!==P.cur[1]))]).slice(0,3);P.opts=shuffle([P.cur[1],...others])}
function praepV(){if(tab==='notes')return groupsV('preps',PG)+notesV('praep');P.mode=P.mode||'sort';
  let h=`<div class="seg"><button data-act="pmode" data-v="sort" class="${P.mode==='sort'?'on':''}">Sort into the jars</button><button data-act="pmode" data-v="contr" class="${P.mode==='contr'?'on':''}">Contractions</button></div>`;
  if(P.mode==='sort'){if(!P.cur)qNext('preps');if(!P.cur)return h+'<p>No prepositions yet.</p>';
    h+=`<div class="game"><p class="hint">Which jar does it belong in?</p><div class="big">${esc(P.cur.w)}</div><div class="jars">${Object.entries(PG).map(([g,[t,sub,c]])=>`<button data-act="jar" data-g="${g}" style="background:${c}" ${P.res?'disabled':''}>${t}<br><small style="font-weight:400">${sub}</small></button>`).join('')}</div>${fbQ(PG)}</div>`}
  else{if(!P.cur||!P.opts)cNext();h+=`<div class="game"><p class="hint">What is the short form?</p><div class="big">${esc(P.cur[0])}</div><div class="jars">${P.opts.map(o=>`<button data-act="copt" data-v="${esc(o)}" style="background:var(--sage)" ${P.res?'disabled':''}>${esc(o)}</button>`).join('')}</div><p class="fb ${P.res===true?'ok':P.res===false?'bad':''}" aria-live="polite">${P.res===true?'Correct!':P.res===false?`${esc(P.cur[0])} → ${esc(P.cur[1])}`:''}</p>${P.res===false?'<button class="btn main" data-act="cnext">Next</button>':''}</div>`}
  return h+scoreLine()}
const scoreLine=()=>P.total?`<p class="hint" style="text-align:center">This session: ${P.score} of ${P.total} correct</p>`:'';
function fbQ(G){return `<p class="fb ${P.res===true?'ok':P.res===false?'bad':''}" aria-live="polite">${P.res===true?'Correct!':P.res===false?`“${esc(P.cur.w)}” belongs to: ${G[P.cur.g][0]} (${G[P.cur.g][1]})`:''}</p>${P.res===false?'<button class="btn main" data-act="qnext">Next</button>':''}`}

/* Konnektoren */
function konnV(){if(tab==='notes')return groupsV('conn',CG)+notesV('konn');if(!P.cur)qNext('conn');if(!P.cur)return '<p>No connectors yet.</p>';

/* Verben */
function vNext(){if(!P.q||!P.q.length)P.q=shuffle(S.verbs.map((_,i)=>i));P.cur=P.q.shift();P.flip=false}
function verbenV(){if(tab==='notes')return notesV('verben');if(P.cur==null||!S.verbs[P.cur])vNext();const v=S.verbs[P.cur];
  const card=!v?'<p>No verbs yet. Add one below.</p>':`<button class="card" data-act="flip" aria-label="Flip card">${P.flip?`<div class="big" style="margin:0 0 6px">${esc(v.inf)}</div><dl><dt>Meaning</dt><dd>${esc(v.en)}</dd><dt>Präteritum (simple past)</dt><dd>er/sie ${esc(v.prat)}</dd><dt>Perfekt (spoken past)</dt><dd>er/sie ${v.aux==='sein'?'ist':'hat'} ${esc(v.p2)}</dd></dl>`:`<div class="big" style="margin:0">${esc(v.inf)}</div><span class="hint">Tap to flip · do you know the Präteritum and Perfekt?</span>`}</button>`;
  return `<div class="game">${card}${v&&P.flip?'<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-act="vagain">Not yet</button><button class="btn main" data-act="vknew">I knew it!</button></div>':''}</div>`+scoreLine()+
  `<details><summary><b>Your verb cards (${S.verbs.length})</b></summary><div class="scroll"><table class="vt"><tr><th>Verb</th><th>Meaning</th><th>Präteritum</th><th>Perfekt</th><th></th></tr>${S.verbs.map((v,i)=>`<tr><td><b>${esc(v.inf)}</b></td><td>${esc(v.en)}</td><td>${esc(v.prat)}</td><td>${v.aux==='sein'?'ist':'hat'} ${esc(v.p2)}</td><td><button class="btn sm danger" data-act="rmverb" data-i="${i}" aria-label="Delete ${esc(v.inf)}">×</button></td></tr>`).join('')}</table></div>
  <p class="hint" style="margin-top:12px">New card</p><div class="groups" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))"><input type="text" id="vinf" placeholder="Infinitive (e.g. backen)" lang="de"><input type="text" id="ven" placeholder="Meaning (bake)"><input type="text" id="vprat" placeholder="Präteritum, er/sie form (backte)" lang="de"><input type="text" id="vp2" placeholder="Partizip II (gebacken)" lang="de"><select id="vaux" aria-label="Helper verb"><option value="haben">hat</option><option value="sein">ist</option></select><button class="btn main" data-act="addverb">Add</button></div></details>`}

/* Tagebuch */
function connFound(t){const words=new Set((t.toLowerCase().match(/[a-zäöüß]+/g)||[]));const out=[];for(const [g,a] of Object.entries(S.conn))for(const c of a){const base=c.replace(/\(.*?\)/g,'').trim().split(/[\s…]+/)[0].toLowerCase();if(base&&words.has(base)&&!out.some(o=>o.w===base))out.push({w:base,g})}return out}
function jStats(t){const w=(t.match(/\S+/g)||[]).length,c=connFound(t);return `<span><b>${w}</b> words</span>${JE&&JE.ch?`<span>${chkDone(JE.ch,t)?'<b>✓ Challenge done!</b>':'Challenge: not yet'}</span>`:''}${c.length?'<span>Connectors used:</span>'+c.map(o=>`<span class="chip c-${o.g}" style="padding-right:10px">${esc(o.w)}</span>`).join(''):'<span>Tip: join sentences with weil, aber, deshalb …</span>'}`}
function journalV(){if(JE.ch===undefined)JE.ch=jChallenge();const e=JE,list=[...J].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
  return `<div class="row"><input type="date" id="jdate" value="${esc(e.date)}" aria-label="Date" style="max-width:200px"><span class="hint" style="margin:0">${e.id?'Editing an entry':'New entry'}</span></div>
  ${e.prompt?`<div class="prompt"><b>${esc(e.prompt[0])}</b><br><span class="hint">${esc(e.prompt[1])}</span></div>`:'<div class="prompt"><span class="hint">Free writing, no question.</span></div>'}
  <div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="jprompt">Different question</button><button class="btn sm" data-act="jnoprompt">No question</button></div>
  <div class="prompt">${e.ch?`<b>✨ Challenge: ${esc(e.ch.t)}</b><br><span class="hint">${esc(e.ch.h)}</span>`:'<span class="hint">No grammar challenge this time.</span>'}</div>
  <div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="jch">Different challenge</button>${e.ch?'<button class="btn sm" data-act="jnoch">No challenge</button>':''}</div>
  <textarea id="jtext" lang="de" spellcheck="true" rows="8" placeholder="Heute habe ich …" aria-label="Journal entry">${esc(e.text)}</textarea>
  <div class="jstats" id="jstats">${jStats(e.text)}</div>
  <div class="row"><button class="btn main" data-act="jsave">${e.id?'Save changes':'Save entry'}</button>${e.id||e.text?'<button class="btn" data-act="jnew">Start a new entry</button>':''}</div>
  <p class="hint" style="margin-top:22px">Your past entries are kept in the <b>Denkarium</b>, the stack of books at the end of the desk.</p><button class="btn" data-act="openlogs">Open the Denkarium (${J.length} ${J.length===1?'entry':'entries'})</button>`}
function logsV(){const list=[...J].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0));
  return `<div class="row" style="margin-bottom:6px"><button class="btn sm" data-act="opentagebuch">✎ Write a new entry</button></div>
  <h3 style="margin:12px 0 10px">Your entries (${J.length})</h3>${list.length?list.map(x=>`<article class="entry"><h3>${new Date(x.date+'T12:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3>${x.prompt?`<p class="pr">${esc(x.prompt[0])}</p>`:''}<p>${esc(x.text)}</p>${x.ch?`<p class="pr">Challenge: ${esc(x.ch.t)}${chkDone(x.ch,x.text)?' ✓':''}</p>`:''}${x.corr?`<div class="corr"><b>Correction</b>${corrHTML(x.corr)}</div>`:''}${P.jai===x.id?corrBox(x):''}<div class="na"><button class="btn sm" data-act="jai" data-id="${x.id}">${x.corr?'Correct again':'Get a correction'}</button>${x.corr?`<button class="btn sm danger" data-act="jcorrdel" data-id="${x.id}">Remove correction</button>`:''}<button class="btn sm" data-act="jcopy" data-id="${x.id}">Copy</button><button class="btn sm" data-act="jedit" data-id="${x.id}">Edit</button><button class="btn sm danger" data-act="jdel" data-id="${x.id}">Delete</button></div></article>`).join(''):'<p class="hint">No entries yet. One or two sentences is plenty to start.</p>'}
  <p class="hint">Tip: <b>Get a correction</b> copies your entry with a request for Claude. Paste it into Claude, then paste the answer back here.</p>`}
/* journal: grammar challenges + corrections via Claude (copy / paste, no API key needed) */
const reEsc=w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function jChallenge(){const C=[],sub=S.conn.sub.map(bare),adv=S.conn.adv.filter(w=>!w.includes('…')).map(bare);
  const fs=['weil','dass','obwohl','wenn','als','nachdem','damit','ob','bevor','während','sobald','falls'].filter(w=>sub.includes(w)),w1=pick(fs.length?fs:sub);if(w1)C.push({t:`Use the connector „${w1}“`,h:'It starts a Nebensatz, so the verb goes to the end.',w:[w1]});
  const fa=['deshalb','trotzdem','außerdem','danach','deswegen','allerdings','dann','also','zuerst','schließlich'].filter(w=>adv.includes(w)),w2=pick(fa.length?fa:adv);if(w2)C.push({t:`Join two sentences with „${w2}“`,h:'The verb comes right after it, then the subject.',w:[w2]});
  const wp=pick(S.preps.wech||[]);if(wp)C.push({t:`Use „${wp}“ (Wechselpräposition)`,h:'Wo? → Dativ · Wohin? → Akkusativ.',w:[wp]});
  const sv=S.verbs.filter(v=>v.aux==='sein'&&v.p2);if(sv.length){const v=pick(sv);C.push({t:`Write a sentence in Perfekt with „${v.inf}“`,h:`It goes with sein: … ist … ${v.p2}.`,w:[v.p2]})}
  C.push({t:'Use a Relativsatz',h:'…, der / die / das … with the verb at the end. Das ist die Frau, die …',re:',\\s*(mit |von |zu |bei |auf |in |an )?(der|die|das|den|dem|denen|deren|dessen)\\s'});
  C.push({t:'Use a Modalverb',h:'Modal verb in position 2, the other verb at the end: Ich muss heute arbeiten.',re:'\\b(muss|musst|müssen|kann|kannst|können|darf|darfst|dürfen|will|willst|wollen|soll|sollst|sollen|möchte|möchtest|möchten)\\b'});
  if(S.vocab.length){const v=pick(S.vocab),key=v.de.replace(/^(der|die|das|sich|ein|eine)\s+/i,'').split(/[\s\/(…,]/)[0];if(key.length>2)C.push({t:`Use a word from your jar: „${v.de}“`,h:v.en,w:[key]})}
  return pick(C)}
function chkDone(ch,t){if(!ch||!t)return false;if(ch.re)return new RegExp(ch.re,'i').test(t);const s=t.toLowerCase();return (ch.w||[]).some(w=>w&&new RegExp('(^|[^a-zäöüß])'+reEsc(w.toLowerCase())+'([^a-zäöüß]|$)').test(s))}
function corrHTML(src){return md(src).replace(/\[\[(.+?)\]\]/g,(m,t)=>`<button class="btn sm" data-act="jnote" data-t="${t}">📖 ${t}</button>`)}
function corrBox(x){return `<div class="corrbox"><p class="hint">${P.jaiOk?'Copied ✓ Now paste it into Claude (claude.ai or the Claude app), then paste Claude\'s answer below.':'Copy this text, paste it into Claude, then paste Claude\'s answer below.'}</p>${P.jaiOk?'':`<textarea readonly rows="5" onclick="this.select()">${esc(corrPrompt(x))}</textarea>`}<textarea id="jcorr" placeholder="Paste Claude's correction here" aria-label="Correction"></textarea><div class="row"><button class="btn main" data-act="jcorrsave" data-id="${x.id}">Save correction</button><button class="btn" data-act="jcorrx">Cancel</button></div></div>`}
function corrPrompt(x){const g=[];for(const [k,arr] of Object.entries(S.notes)){if(k==='vocab'||!(arr||[]).length)continue;const name=k.startsWith('pin:')?((S.pins.find(p=>'pin:'+p.id===k)||{}).title||k):(ST[k]||{}).n||k;const ts=arr.filter(n=>n.t).map(n=>n.t);if(ts.length)g.push(name+': '+ts.join(' | '))}
  return `Please correct my German journal entry. I'm learning German (around B1).\n\n1. Write my text again, corrected, with each change in **bold**.\n2. Then list each mistake on its own line starting with "- ": what I wrote → the correct version, and a short, simple explanation in English.\n3. If one of my notes (titles below) explains the rule, put its exact title in double square brackets at the end of that line, like [[Nebensatz · subordinate clause]].\nUse only **bold** and lines starting with "- ". No headings, tables or numbered lists.\n\nMy note titles:\n${g.join('\n')}\n\nMy entry${x.prompt?' (question: '+x.prompt[0]+')':''}${x.ch?' (challenge: '+x.ch.t+')':''}:\n${x.text}`}
function findNote(t){const q=t.toLowerCase().split(' · ')[0].trim();let hit=null;for(const [k,arr] of Object.entries(S.notes)){if(k==='vocab')continue;for(const n of arr||[]){const nt=(n.t||'').toLowerCase().split(' · ')[0].trim();if(nt===q)return [k,n.id];if(!hit&&nt&&(nt.includes(q)||q.includes(nt)))hit=[k,n.id]}}return hit}
async function jSave(){const t=$('#jtext').value.trim();if(!t)return;const isNew=!JE.id,id=JE.id||'e'+Date.now(),old=J.find(x=>x.id===id);const entry={date:$('#jdate').value||today(),prompt:JE.prompt||null,ch:JE.ch||null,text:t,created:old?old.created:Date.now(),updated:Date.now(),...(old&&old.corr?{corr:old.corr}:{})};
  J=[...J.filter(x=>x.id!==id),{id,...entry}];LS.set('zs-journal',J);LS.set('zs-draft',null);JE={id:null,date:today(),prompt:pick(PROMPTS),text:''};if(isNew)addLeaves(2);render();
  if(jCol){try{await jCol.doc(id).set(entry);status('Saved to your account ✓')}catch(e){status('Entry saved on this device only')}}}
async function jDel(id){J=J.filter(x=>x.id!==id);LS.set('zs-journal',J);render();if(jCol){try{await jCol.doc(id).delete()}catch(e){}}}

function plantV(){const toFlower=10-S.leaves%10;return `<div class="game" style="display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:16px;align-items:center;text-align:left"><img src="img/plant.jpg" alt="" style="width:100%;border-radius:12px;filter:saturate(${Math.min(1.3,.5+S.leaves/30)})"><div><div class="big" style="margin:0 0 8px">${S.leaves} ${S.leaves===1?'Blatt':'Blätter'}</div><div class="prog" aria-hidden="true"><i style="width:${(S.leaves%10)*10}%"></i></div><p class="hint">${toFlower} more ${toFlower===1?'leaf':'leaves'} until the next blossom.</p></div></div>
  <p>Your plant grows with you: <b>+2</b> for each journal entry, <b>+1</b> for each new note, <b>+1</b> for every 5 correct answers when practising.</p><p class="hint">No streaks and nothing to lose. If you take a week off, it just waits for you.</p>

  }

(()=>{const c=$('#chips');let down=false,sx=0,sl=0,moved=false;
  c.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=c.scrollLeft});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(!moved&&Math.abs(dx)>5){moved=true;c.classList.add('drag')}if(moved)c.scrollLeft=sl-dx});
  window.addEventListener('pointerup',()=>{if(!down)return;down=false;setTimeout(()=>c.classList.remove('drag'),0)});
  c.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  c.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&c.scrollWidth>c.clientWidth){c.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})})();

async function fbInit(){if(!FIREBASE_CONFIG)return null;if(FB)return FB;const base='https://www.gstatic.com/firebasejs/10.12.2/';await loadJs(base+'firebase-app-compat.js');await Promise.all([loadJs(base+'firebase-auth-compat.js'),loadJs(base+'firebase-firestore-compat.js')]);
